  <main class="document-reader">
    <div class="container">
      <div class="document-titlebar">
        <div>
          <span class="repository-kicker">Academic report</span>
          <h1 id="document-title">Loading document…</h1>
        </div>
        <a id="document-download" class="document-download" href="#" download>Download PDF</a>
      </div>
      <div class="pdf-frame-wrap">
        <object id="pdf-object" class="pdf-frame" type="application/pdf">
          <p>Your browser cannot display this PDF. <a id="pdf-fallback" href="#">Open the document</a>.</p>
        </object>
      </div>
    </div>
  </main>

  <script>
    const allowedDocuments = new Map([
      ['informe_academico_cfk_justicia_junio_2025.pdf', 'Cristina Fernández de Kirchner, the courts and polarization'],
      ['informe_academico_ddd_abril_2025.pdf', 'Argentina in a turbulent international landscape'],
      ['informe_academico_ddd_abril_2026.pdf', 'Re-election, political fatigue and renewal'],
      ['informe_academico_ddd_diciembre.pdf', 'Two years of libertarian government and views on vaccination'],
      ['informe_academico_ddd_febrero_2025.pdf', 'Billionaires, economic power and politics'],
      ['informe_academico_ddd_julio_2025.pdf', 'Household finances, income and social discontent'],
      ['informe_academico_ddd_junio_2025.pdf', 'Savings, dollars and voter turnout'],
      ['informe_academico_ddd_junio_2026.pdf', 'Gender violence, justice and the state response'],
      ['informe_academico_ddd_mayo_2025.pdf', 'Government, journalism and press freedom'],
      ['informe_academico_ddd_mayo_2026.pdf', 'Government approval and demand for change'],
      ['informe_academico_ddd_octubre_2025.pdf', 'Academic survey report: “No dollars, no paradise”'],
      ['informe_academico_encuesta_ni_una_menos.pdf', 'Public perceptions of violence against women in Argentina'],
      ['informe_academico_juventudes_unvm_2025.pdf', 'Young people, politics and representation'],
      ['informe_academico_lo_peor_ya_paso_septiembre_2025.pdf', 'Academic survey report: “The worst is over”'],
      ['informe_academico_medios_noticias_argentina.pdf', 'Media and news in Argentina'],
      ['informe_academico_un_ano_de_polarizacion_2024.pdf', 'A year of total polarization'],
      ['informe_academico_vdd_agosto_2025.pdf', 'Science, artificial intelligence and politics']
    ]);

    const params = new URLSearchParams(window.location.search);
    // Older links used duplicate copies named "... (1).pdf".
    const file = (params.get('file') || '').replace(/ \(1\)\.pdf$/, '.pdf');
    const title = allowedDocuments.get(file);
    const heading = document.querySelector('#document-title');
    const pdfObject = document.querySelector('#pdf-object');
    const download = document.querySelector('#document-download');
    const fallback = document.querySelector('#pdf-fallback');

    if (file && title) {
      const pdfUrl = `New format/${encodeURIComponent(file)}`;
      document.title = title + ' (in Spanish) – Matías Gaglio';
      heading.textContent = title;
      pdfObject.data = pdfUrl;
      download.href = pdfUrl;
      fallback.href = pdfUrl;
    } else {
      document.title = 'Document not found';
      heading.textContent = 'Document not found';
      download.hidden = true;
      pdfObject.replaceWith(Object.assign(document.createElement('p'), {
        className: 'document-error',
        textContent: 'This link does not point to a document in the repository.'
      }));
    }
  </script>
