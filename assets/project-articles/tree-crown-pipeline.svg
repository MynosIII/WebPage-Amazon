<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura del estimador geoespacial de copas de árboles</title>
  <desc id="desc">Diagrama digital del flujo entre una imagen NAIP, DeepForest, georreferenciación y salidas GeoJSON y JPG.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#294237" stroke-width="1"/></pattern>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132b21"/><stop offset="1" stop-color="#24372e"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#07100c"/>
  <rect x="38" y="34" width="1124" height="607" rx="14" fill="#0c1712" stroke="#294237"/>
  <text x="70" y="78" fill="#eaf4ed" font-family="Arial,sans-serif" font-size="23" font-weight="700">TREE CROWN ESTIMATOR · PIPELINE GEOESPACIAL</text>
  <text x="70" y="107" fill="#84a391" font-family="Arial,sans-serif" font-size="14">Representación de arquitectura · no es un resultado experimental</text>
  <g transform="translate(70 148)">
    <rect width="430" height="350" rx="10" fill="url(#land)" stroke="#416858"/>
    <rect width="430" height="350" rx="10" fill="url(#grid)" opacity=".55"/>
    <path d="M0 250C100 208 146 290 233 233s128-31 197-78V350H0Z" fill="#34453c"/>
    <path d="M-20 75L450 265" stroke="#8d8170" stroke-width="30" opacity=".72"/>
    <g fill="#2c6b45"><circle cx="80" cy="98" r="34"/><circle cx="168" cy="96" r="26"/><circle cx="260" cy="148" r="38"/><circle cx="346" cy="102" r="30"/><circle cx="112" cy="256" r="39"/><circle cx="310" cy="282" r="42"/></g>
    <g fill="none" stroke="#65e294" stroke-width="3"><rect x="42" y="60" width="76" height="74"/><rect x="137" y="68" width="62" height="60"/><rect x="218" y="106" width="84" height="83"/><rect x="311" y="67" width="73" height="69"/><rect x="69" y="212" width="86" height="86"/><rect x="264" y="237" width="94" height="92"/></g>
    <text x="20" y="330" fill="#d7e9dd" font-family="Arial,sans-serif" font-size="14">RASTER GEOREFERENCIADO · CUADROS CANDIDATOS</text>
  </g>
  <g transform="translate(555 158)" font-family="Arial,sans-serif">
    <g><rect width="575" height="78" rx="8" fill="#12231b" stroke="#355848"/><text x="24" y="31" fill="#65e294" font-size="13" font-weight="700">01 · ENTRADA</text><text x="24" y="57" fill="#eaf4ed" font-size="20" font-weight="700">GeoTIFF NAIP · 1 m/píxel</text></g>
    <g transform="translate(0 92)"><rect width="575" height="78" rx="8" fill="#12231b" stroke="#355848"/><text x="24" y="31" fill="#65e294" font-size="13" font-weight="700">02 · INFERENCIA</text><text x="24" y="57" fill="#eaf4ed" font-size="20" font-weight="700">DeepForest · tiles 400 px · overlap 25%</text></g>
    <g transform="translate(0 184)"><rect width="575" height="78" rx="8" fill="#12231b" stroke="#355848"/><text x="24" y="31" fill="#65e294" font-size="13" font-weight="700">03 · GEOREFERENCIACIÓN</text><text x="24" y="57" fill="#eaf4ed" font-size="20" font-weight="700">Rasterio + GeoPandas → EPSG:4326</text></g>
    <g transform="translate(0 276)"><rect width="575" height="78" rx="8" fill="#12231b" stroke="#355848"/><text x="24" y="31" fill="#65e294" font-size="13" font-weight="700">04 · SALIDAS ACTUALES</text><text x="24" y="57" fill="#eaf4ed" font-size="20" font-weight="700">GeoJSON de cajas + JPG anotado</text></g>
  </g>
  <path d="M520 327H540" stroke="#65e294" stroke-width="3"/><path d="m536 319 10 8-10 8" fill="none" stroke="#65e294" stroke-width="3"/>
  <text x="70" y="578" fill="#84a391" font-family="Arial,sans-serif" font-size="16">Validación prevista: superponer el GeoJSON sobre el raster en QGIS y revisar falsos positivos, omisiones y desplazamiento.</text>
  <text x="70" y="610" fill="#eaf4ed" font-family="Arial,sans-serif" font-size="14" font-weight="700">EL MODELO DETECTA COPAS DE ÁRBOLES, NO HOJAS INDIVIDUALES.</text>
</svg>
