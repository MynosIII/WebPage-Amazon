<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Estimated shop share versus measured signals">
<rect width="1600" height="900" fill="#07090c"/>
<text x="240" y="140" fill="#ef2016" font-family="system-ui,sans-serif" font-size="26" font-weight="800" letter-spacing="5">WHAT SHARE OF BUYERS ARE SHOPS?</text>
<text x="240" y="205" fill="#f6f7f9" font-family="system-ui,sans-serif" font-size="52" font-weight="800">Estimates vs measured signals</text>
<text x="240" y="314" fill="#aab1bd" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Planning estimate</text>
<rect x="620" y="265" width="600" height="74" rx="8" fill="#ef2016"/>
<text x="1236" y="315" fill="#f6f7f9" font-family="system-ui,sans-serif" font-size="30" font-weight="800">50%</text>
<text x="240" y="418" fill="#aab1bd" font-family="system-ui,sans-serif" font-size="28" font-weight="700">My estimate</text>
<rect x="620" y="369" width="240" height="74" rx="8" fill="#f0c75e"/>
<text x="876" y="419" fill="#f6f7f9" font-family="system-ui,sans-serif" font-size="30" font-weight="800">15–25%</text>
<text x="240" y="522" fill="#aab1bd" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Business-account units</text>
<rect x="620" y="473" width="144" height="74" rx="8" fill="#5fd28b"/>
<text x="780" y="523" fill="#f6f7f9" font-family="system-ui,sans-serif" font-size="30" font-weight="800">~12%</text>
<text x="240" y="626" fill="#aab1bd" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Repeat buyers</text>
<rect x="620" y="577" width="108" height="74" rx="8" fill="#5fd28b"/>
<text x="744" y="627" fill="#f6f7f9" font-family="system-ui,sans-serif" font-size="30" font-weight="800">8–10%</text>
<text x="240" y="730" fill="#aab1bd" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Bulk-style searches</text>
<rect x="620" y="681" width="8" height="74" rx="8" fill="#5fd28b"/>
<text x="644" y="731" fill="#f6f7f9" font-family="system-ui,sans-serif" font-size="30" font-weight="800">0.5%</text>
</svg>