  <text x="62" y="260" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="48" font-weight="800">Aprender después.</text>
  <text x="62" y="304" fill="#aeb4bf" font-family="Arial,sans-serif" font-size="18">Cada carrera se predice con información disponible antes del fin de semana.</text>
  <g transform="translate(62 360)">
