<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Resumen del backtest histórico de F1Predictor</title>
  <desc id="desc">Interfaz oscura con métricas verificadas del backtest de 1.156 Grandes Premios entre 1951 y 2026.</desc>
  <rect width="1200" height="675" fill="#07090c"/>
  <path d="M0 92H1200M0 584H1200" stroke="#252b33"/>
  <text x="62" y="54" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="22" font-weight="700">F1PREDICTOR · WALK-FORWARD BACKTEST</text>
  <circle cx="1120" cy="46" r="8" fill="#ef2016"/>
  <text x="1140" y="53" fill="#aeb4bf" font-family="Arial,sans-serif" font-size="15">1951–R14 2026</text>
  <text x="62" y="154" fill="#ef2016" font-family="Arial,sans-serif" font-size="18" font-weight="700">CORTE PRE-FP1</text>
